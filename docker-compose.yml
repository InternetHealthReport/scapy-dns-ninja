version: "3.8"

services:
  dns-ninja:
    build: .
    image: scapy-dns-ninja:latest
    container_name: scapy-dns-ninja
    restart: unless-stopped
    ports:
      - "${DNS_PORT:-8053}:53/udp"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      # Leave SERVER_IP unset to auto-detect the container's own IP (recommended,
      # since docker's DNAT rewrites the destination address of forwarded packets).
      # SERVER_IP: 172.17.0.2
      SERVER_DOMAIN: ${SERVER_DOMAIN:-ninja.ihr.live}
    volumes:
      - ./_default:/app/_default
      - ./content:/app/content
      - ./cruxkz:/app/cruxkz
      # Uncomment to persist a custom config across restarts:
      # - ./ninja-server.conf:/app/ninja-server.conf

